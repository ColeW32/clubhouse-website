<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clubhouse</title>
    <meta name="description" content="Engage audiences across our digital portfolio." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f2ecdf'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23b3bfce' stroke-width='2.5'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <h1 class="sr-only">Clubhouse</h1>
    <main>
      <section class="panel" id="portfolio">
        <div class="panel__inner">
          <div class="panel__copy">
            <h2>Engage audiences<br />across our digital<br />portfolio.</h2>
            <p>with millions of users on our owned-and-operated apps and websites.</p>
          </div>
          <div class="window" id="window-ramp" aria-hidden="true">
            <div class="window__layer">
              <svg viewBox="0 0 600 460">
                <g transform="translate(500 263.333) rotate(-18.435)">
                  <g data-wedge>
                    <polygon class="scene-solid" points="-121,0 -57,0 -89,-64" />
                  </g>
                </g>
                <polygon class="scene-mask" points="-100,463.33 700,196.67 700,620 -100,620" />
                <line class="scene-stroke" x1="-80" y1="456.67" x2="680" y2="203.33" />
                <circle data-ball class="scene-solid" cx="470.28" cy="174.16" r="94" />
              </svg>
            </div>
          </div>
        </div>
      </section>

      <section class="panel panel--flip" id="quality">
        <div class="panel__inner">
          <div class="window" id="window-drop" aria-hidden="true">
            <div class="window__layer">
              <svg viewBox="0 0 600 460">
                <line class="scene-stroke" x1="302" y1="283" x2="233" y2="510" />
                <line class="scene-stroke" x1="302" y1="283" x2="355" y2="510" />
                <g data-ball transform="translate(302 189)">
                  <circle class="scene-solid" cx="0" cy="0" r="94" />
                </g>
              </svg>
            </div>
          </div>
          <div class="panel__copy">
            <h2>Stop balancing quality.<br />You can have it all.</h2>
            <p>Clubhouse matches your offer to users likely to convert using proprietary machine learning.</p>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
